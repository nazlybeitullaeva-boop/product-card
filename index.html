<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбери свой продукт</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="./page-title.css">
  <link rel="stylesheet" href="./cards.css">
  <link rel="stylesheet" href="./card.css">
  <link rel="stylesheet" href="./card__composition-list-item.css">
  <link rel="stylesheet" href="./card__composition-list.css">
  <link rel="stylesheet" href="./card__composition-title.css">
  <link rel="stylesheet" href="./card__image.css">
  <link rel="stylesheet" href="./card__price.css">
  <link rel="stylesheet" href="./card__description.css">
  <link rel="stylesheet" href="./card__footer.css">
  <link rel="stylesheet" href="./card__title.css">
  <link rel="stylesheet" href="./card__label.css">
  <link rel="stylesheet" href="./bg-decor.css">
  <link rel="stylesheet" href="./button.css">
  <script src="homework-7.js" defer></script>
  <script src="homework-8.js" defer></script>
  <script src="homework.extension.js" defer></script>
  <script src="homework.extension3.js" defer></script>
  <script src="homework.extension4.js" defer></script>
  <script src="homework.extension5.js" defer></script>
  <script src="homework.extension6.js" defer></script>
  <script type="module" src="homework-9.js"></script>
  <script type="module" src="homework-10.js"></script>
</head>
<body>
   <button id="change-color-all-cards-button">Покрасить все</button>
   <button id="change-color-first-card-button">Покрасить первую</button>
   <button id="open-google-button">Открыть Google</button>
   <button id="output-console-log-button">Вывести сообщение в консоль лог</button>
   <button id="toggle-color-button">Переключить цвет</button>

   <div class="bq-decor"></div>

   <h1 id="title" class="page-title">Выбери свой продукт</h1>

  <ul class="cards" id="product-list"></ul>

  <template id="product-template">
    <li class="card">
      <img class="card__image" src="" alt="" />
      <span class="card__label"></span>
      <h2 class="card__title"></h2>
      <p class="card__description text"></p>
      <span class="card__composition-title">Состав:</span>
      <ul class="card__composition-list"></ul>
      <div class="card__footer">
        <b class="card__price-label">Цена</b>
        <span class="card__price"></span>
        <button class="button">Нажать</button>
      </div>
    </li>
  </template>

</body>
</html>
