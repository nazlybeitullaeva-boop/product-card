<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доп. ДЗ: функции и события</title>
  <link rel="stylesheet" href="homework.extension4.css">
  <script src="homework.extension4.js" defer></script>
</head>
<body>
  <h1 class="title">Выбери свой продукт</h1>
  <input class="name-input" type="text">
  <button class="show-button">Показать</button>
  <button class="color-button">Сменить цвет</button>
  <button class="toggle-button">Переключить active (48)</button>
  <a class="google-link" href="https://google.com">Google</a>
  <form class="form">
    <input class="email-input" type="email">
    <button type="submit">Отправить</button>
  </form>

  <h2>Карточки (49–50)</h2>
  <div class="card">Phone</div>
  <div class="card">Laptop</div>
  <div class="card">Tablet</div>

  <h2>Товары (54–56)</h2>
  <button class="expensive-button">Показать дорогие товары</button>
  <input class="price-input" type="text" placeholder="Минимальная цена">
  <button class="price-button">Показать</button>

  <h2>Задание 61</h2>
  <button class="save-button">Сохранить</button>

  <h2>Итоговая мини-задача</h2>
  <input class="min-price-input" type="text" placeholder="Минимальная цена">
  <button class="show-products-button">Показать товары</button>
</body>
</html>
